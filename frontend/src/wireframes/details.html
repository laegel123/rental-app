<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrabNextDoor - Item Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-teal-600">GrabNextDoor</h1>
            <nav>
                <a href="#" class="text-gray-600 hover:text-teal-600 px-3">Login</a>
                <a href="#" class="text-teal-600 hover:bg-teal-700 hover:text-white border border-teal-600 rounded-full px-4 py-2 transition">Sign Up</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="md:flex">
                <!-- Item Image -->
                <div class="md:w-1/2">
                    <img src="https://placehold.co/600x600?text=Lawn+Mower" alt="Item Image" class="w-full h-full object-cover">
                </div>

                <!-- Item Info -->
                <div class="md:w-1/2 p-8">
                    <h2 class="text-3xl font-bold text-gray-800 mb-4">Electric Lawn Mower</h2>
                    <p class="text-gray-600 mb-6">A very reliable electric lawn mower, perfect for small to medium-sized yards. It's lightweight and easy to handle. Comes with a 50ft extension cord.</p>
                    
                    <div class="mb-6">
                        <span class="text-3xl font-bold text-teal-600">$15<span class="text-lg font-normal text-gray-500">/day</span></span>
                    </div>

                    <!-- Rental Period -->
                    <div class="mb-6">
                        <label for="rental-period" class="block text-sm font-medium text-gray-700 mb-2">Rental Period</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="start-date" class="block text-xs text-gray-600">Start Date</label>
                                <input type="date" id="start-date" class="w-full p-2 border border-gray-300 rounded-md">
                            </div>
                            <div>
                                <label for="end-date" class="block text-xs text-gray-600">End Date</label>
                                <input type="date" id="end-date" class="w-full p-2 border border-gray-300 rounded-md">
                            </div>
                        </div>
                    </div>

                    <!-- Request Button -->
                    <button class="w-full bg-teal-600 text-white font-bold py-3 px-4 rounded-full hover:bg-teal-700 transition mb-8">
                        Request to Rent
                    </button>

                    <!-- Owner Info -->
                    <div class="flex items-center">
                        <img src="https://placehold.co/100x100?text=Owner" alt="Owner" class="w-16 h-16 rounded-full border-2 border-teal-500">
                        <div class="ml-4">
                            <p class="text-sm text-gray-500">Owner</p>
                            <p class="font-bold text-gray-800">John Doe</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
